<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Game Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="toast" class="toast-notification">
    <span>⚠️</span>
    <span id="toastMsg">El juego ya existe en el sistema.</span>
  </div>

  <div class="container">
    <header>
      <div class="brand-logo">
        <span class="controller-icon">🎮</span>
        <h1>Video Game Tracker</h1>
      </div>
    </header>

    <div class="top-controls">
      <div class="create-section-form">
        <input type="text" id="sectionInput" placeholder="Nueva categoría (ej: Por Jugar)..." />
        <button class="btn-primary" onclick="addSection()">+ Categoría</button>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Buscar juego..." oninput="render()" />
      </div>
    </div>

    <div class="platform-filters">
      <button class="filter-btn active" onclick="setPlatformFilter('ALL', this)">Todas</button>
      <button class="filter-btn" onclick="setPlatformFilter('PC', this)">💻 PC</button>
      <button class="filter-btn" onclick="setPlatformFilter('PlayStation', this)">🎮 PlayStation</button>
      <button class="filter-btn" onclick="setPlatformFilter('Xbox', this)">🟩 Xbox</button>
      <button class="filter-btn" onclick="setPlatformFilter('Switch', this)">🔴 Switch</button>
    </div>

    <div class="backup-actions">
      <button class="btn-secondary" onclick="exportData()">💾 Exportar Backup</button>
      <button class="btn-secondary" onclick="document.getElementById('importInput').click()">📂 Importar Backup</button>
      <input type="file" id="importInput" accept=".json" onchange="importData(event)" />
    </div>

    <div id="boardsGrid" class="boards-grid"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
