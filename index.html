<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Game Tracker</title>
  <style>
    :root {
      --bg-primary: #0b0f19;
      --bg-card: #151c2c;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --border: #26334d;
      --danger: #ef4444;
      --title-color: #38bdf8;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      margin: 0;
      padding: 2.5rem 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2.5rem;
      letter-spacing: -0.5px;
    }

    /* Main form */
    .create-section-form {
      display: flex;
      gap: 12px;
      margin-bottom: 2.5rem;
      background: var(--bg-card);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      max-width: 750px;
      margin-left: auto;
      margin-right: auto;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-size: 1.05rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button.btn-primary {
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      background-color: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    button.btn-primary:hover {
      box-shadow: 0 0 14px var(--accent-glow);
      transform: translateY(-1px);
    }

    /* Masonry Layout (2 Columns, no gaps) */
    .boards-grid {
      column-count: 2;
      column-gap: 1.75rem;
    }

    @media (max-width: 750px) {
      .boards-grid {
        column-count: 1;
      }
    }

    /* Category Cards */
    .section-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      break-inside: avoid;
      margin-bottom: 1.75rem;
      display: flex;
      flex-direction: column;
    }

    .section-card.global-completed {
      border-color: var(--success);
      background-color: rgba(16, 185, 129, 0.03);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--title-color);
      margin: 0;
    }

    .global-completed .section-title {
      color: var(--success);
    }

    .add-game-form {
      display: flex;
      gap: 10px;
      margin-bottom: 1.2rem;
    }

    .add-game-form input {
      font-size: 0.95rem;
      padding: 10px 14px;
    }

    .add-game-form button {
      padding: 10px 18px;
      font-size: 0.95rem;
      background-color: #334155;
      color: var(--text-main);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }

    .add-game-form button:hover {
      background-color: var(--accent);
    }

    .game-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .game-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-primary);
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      transition: all 0.25s ease;
    }

    .game-info {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      user-select: none;
      flex: 1;
      overflow: hidden;
    }

    /* Custom Checkbox */
    .checkbox-container {
      position: relative;
      width: 24px;
      height: 24px;
      display: inline-block;
      flex-shrink: 0;
    }

    .checkbox-container input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .custom-checkmark {
      position: absolute;
      top: 0;
      left: 0;
      height: 24px;
      width: 24px;
      background-color: transparent;
      border: 2px solid var(--text-muted);
      border-radius: 7px;
      transition: all 0.2s ease;
    }

    .checkbox-container:hover input ~ .custom-checkmark {
      border-color: var(--accent);
    }

    .checkbox-container input:checked ~ .custom-checkmark {
      background-color: var(--success);
      border-color: var(--success);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }

    .custom-checkmark:after {
      content: "";
      position: absolute;
      display: none;
      left: 7px;
      top: 3px;
      width: 5px;
      height: 11px;
      border: solid white;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg);
    }

    .checkbox-container input:checked ~ .custom-checkmark:after {
      display: block;
    }

    .game-title {
      font-size: 1.05rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .completed .game-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .origin-badge {
      font-size: 0.8rem;
      background-color: #1e293b;
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 12px;
      margin-left: 8px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .delete-btn {
      background: transparent;
      color: var(--text-muted);
      border: none;
      cursor: pointer;
      padding: 6px 10px;
      font-size: 1.15rem;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }

    .delete-btn:hover {
      color: var(--danger);
      background-color: rgba(239, 68, 68, 0.1);
    }

    .empty-msg {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-style: italic;
      text-align: center;
      padding: 12px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎮 Video Game Tracker</h1>
    
    <!-- Create new Category Form -->
    <div class="create-section-form">
      <input type="text" id="sectionInput" placeholder="Create a new Category or Title..." />
      <button class="btn-primary" onclick="addSection()">+ Create Category</button>
    </div>

    <!-- Masonry Grid Container -->
    <div id="boardsGrid" class="boards-grid"></div>
  </div>

  <script>
    // Completely empty default state for new users
    let data = JSON.parse(localStorage.getItem('myGamerUnifiedData')) || {
      sections: [],
      games: []
    };

    function saveData() {
      localStorage.setItem('myGamerUnifiedData', JSON.stringify(data));
      render();
    }

    function addSection() {
      const input = document.getElementById('sectionInput');
      const title = input.value.trim();
      if (!title) return;

      data.sections.push({
        id: Date.now(),
        title: title
      });

      input.value = '';
      saveData();
    }

    function deleteSection(sectionId) {
      data.sections = data.sections.filter(sec => sec.id !== sectionId);
      data.games = data.games.filter(g => g.sectionId !== sectionId);
      saveData();
    }

    function addGame(sectionId) {
      const input = document.getElementById(`input-${sectionId}`);
      const gameTitle = input.value.trim();
      if (!gameTitle) return;

      data.games.push({
        id: Date.now(),
        sectionId: sectionId,
        title: gameTitle,
        completed: false
      });

      saveData();
    }

    function toggleGame(gameId) {
      const game = data.games.find(g => g.id === gameId);
      if (game) {
        game.completed = !game.completed;
        saveData();
      }
    }

    function deleteGame(gameId) {
      data.games = data.games.filter(g => g.id !== gameId);
      saveData();
    }

    function render() {
      const boardsGrid = document.getElementById('boardsGrid');
      boardsGrid.innerHTML = '';

      // 1. Render active categories
      data.sections.forEach(sec => {
        const pendingGames = data.games.filter(g => g.sectionId === sec.id && !g.completed);

        const sectionCard = document.createElement('div');
        sectionCard.className = 'section-card';

        sectionCard.innerHTML = `
          <div class="section-header">
            <h2 class="section-title">${escapeHtml(sec.title)}</h2>
            <button class="delete-btn" onclick="deleteSection(${sec.id})" title="Delete category">✕</button>
          </div>

          <div class="add-game-form">
            <input type="text" id="input-${sec.id}" placeholder="Add a game..." onkeypress="handleGameKeypress(event, ${sec.id})" />
            <button onclick="addGame(${sec.id})">+ Add</button>
          </div>

          <div class="game-list" id="games-${sec.id}"></div>
        `;

        boardsGrid.appendChild(sectionCard);

        const gamesListEl = document.getElementById(`games-${sec.id}`);
        if (pendingGames.length === 0) {
          gamesListEl.innerHTML = '<div class="empty-msg">No pending games.</div>';
        } else {
          pendingGames.forEach(game => {
            gamesListEl.appendChild(createGameElement(game, false));
          });
        }
      });

      // 2. Render global Completed Games card
      const completedGames = data.games.filter(g => g.completed);
      const completedCard = document.createElement('div');
      completedCard.className = 'section-card global-completed';

      completedCard.innerHTML = `
        <div class="section-header">
          <h2 class="section-title">🏆 Completed Games</h2>
        </div>
        <div class="game-list" id="completedContainer"></div>
      `;

      boardsGrid.appendChild(completedCard);

      const completedContainer = document.getElementById('completedContainer');

      if (completedGames.length === 0) {
        completedContainer.innerHTML = '<div class="empty-msg">No completed games yet.</div>';
      } else {
        completedGames.forEach(game => {
          const originalSec = data.sections.find(s => s.id === game.sectionId);
          const sectionName = originalSec ? originalSec.title : "General";
          
          completedContainer.appendChild(createGameElement(game, true, sectionName));
        });
      }
    }

    function createGameElement(game, isCompleted, sectionName = '') {
      const gameEl = document.createElement('div');
      gameEl.className = `game-item ${isCompleted ? 'completed' : ''}`;
      
      const originBadgeHtml = isCompleted ? `<span class="origin-badge">${escapeHtml(sectionName)}</span>` : '';

      gameEl.innerHTML = `
        <label class="game-info">
          <span class="checkbox-container">
            <input type="checkbox" ${isCompleted ? 'checked' : ''} onchange="toggleGame(${game.id})">
            <span class="custom-checkmark"></span>
          </span>
          <span class="game-title" title="${escapeHtml(game.title)}">${escapeHtml(game.title)}</span>
          ${originBadgeHtml}
        </label>
        <button class="delete-btn" onclick="deleteGame(${game.id})" title="Delete game">✕</button>
      `;
      return gameEl;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    function handleGameKeypress(event, sectionId) {
      if (event.key === 'Enter') addGame(sectionId);
    }

    document.getElementById('sectionInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addSection();
    });

    render();
  </script>
</body>
</html>
